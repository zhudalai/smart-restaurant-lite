services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: srl-app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: smart_restaurant
      DB_USERNAME: srl
      DB_PASSWORD: secret

  db:
    image: mysql:8.0
    container_name: srl-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: smart_restaurant
      MYSQL_USER: srl
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dbdata:
